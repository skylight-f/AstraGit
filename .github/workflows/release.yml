name: AstraGit Release
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'skylight-f/AstraGit' && vars.ASTRAGIT_AUTO_RELEASE != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: 检查 Homebrew 发布凭据
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo '::error::发布必须同步 skylight-f/homebrew-tap。请在 AstraGit 的 Actions Secrets 中配置 HOMEBREW_TAP_TOKEN，并授予目标 Tap 仓库 Contents 读写权限。'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检出 Homebrew Tap 并验证发布权限
        uses: actions/checkout@v4
        with:
          repository: skylight-f/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: .tmp/homebrew-tap
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 验证 Homebrew Tap 实际推送权限
        run: node scripts/sync-homebrew-tap.mjs --check-access .tmp/homebrew-tap
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:publish
  candidate:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.candidate.outputs.ready }}
      commit: ${{ steps.candidate.outputs.commit }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-automatic-release.mjs
  build:
    needs: candidate
    if: needs.candidate.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            extension: dmg
            artifact: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
            extension: dmg
            artifact: x64
          - runner: windows-2025
            platform: win
            arch: x64
            extension: exe
            artifact: win-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:desktop
        if: runner.os == 'Windows'
      - name: 下载 macOS Electron
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm setup:desktop; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Electron 下载失败，正在重试（$attempt/3）。"
              sleep "$((10 * attempt))"
            fi
          done
          exit 1
      - name: 校验原生辅助程序的架构检查
        if: runner.os == 'macOS'
        run: node --test tests/macos-architecture.test.mjs
      - name: 构建并校验正式安装包
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_APPLE_DISTRIBUTION: ${{ vars.REQUIRE_APPLE_DISTRIBUTION }}
        run: pnpm build:release
      - name: 构建 Windows EXE
        if: runner.os == 'Windows'
        run: pnpm build:release
      - name: 验证 Windows Git 工作区与项目提交
        if: runner.os == 'Windows'
        run: |
          git --version
          node --import tsx --test tests/app.test.mjs tests/source-batch.test.mjs
      - name: 验证 Windows 安装、更新接力和重新启动
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Join-Path $PWD "release\AstraGit-$version-win-x64-setup.exe"
          $installPath = Join-Path $env:RUNNER_TEMP 'AstraGit Windows x64'
          $executable = Join-Path $installPath 'AstraGit.exe'
          $setup = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installPath" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "AstraGit installer exited with $($setup.ExitCode)." }
          $oldWriteTime = [DateTime]::SpecifyKind([DateTime]'2000-01-01', [DateTimeKind]::Utc)
          (Get-Item -LiteralPath $executable).LastWriteTimeUtc = $oldWriteTime
          $env:ASTRAGIT_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'AstraGit-user-data'
          $env:ASTRAGIT_CODEX_ENABLED = '0'
          $readyFile = Join-Path $env:ASTRAGIT_USER_DATA_DIR 'updates\app-ready.json'
          $application = Start-Process -FilePath $executable -PassThru
          $restarted = $null
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while (!(Test-Path $readyFile) -and (Get-Date) -lt $deadline) {
              if ($application.HasExited) { throw "AstraGit exited with $($application.ExitCode) during launch." }
              Start-Sleep -Milliseconds 500
            }
            if (!(Test-Path $readyFile)) { throw 'The installed AstraGit renderer did not become ready.' }
            $ready = Get-Content $readyFile -Raw | ConvertFrom-Json
            if ($ready.version -ne $version -or $ready.pid -ne $application.Id) {
              throw 'The running application does not match the installed release.'
            }
            Write-Host "AstraGit $version installed and the renderer is ready."
            $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            $handoff = @'
          import { launchWindowsUpdate } from './apps/desktop/dist/main/windowsReleaseUpdate.js';
          const [executable, installer, sha256, version, dataDirectory, pid] = process.argv.slice(1);
          await launchWindowsUpdate({ executable, installer, sha256, version, dataDirectory, mainPid: Number(pid) });
          '@
            node --input-type=module -e $handoff -- $executable $installer $digest $version $env:ASTRAGIT_USER_DATA_DIR $application.Id
            if ($LASTEXITCODE -ne 0) { throw 'Could not start the Windows update handoff.' }
            if (!$application.CloseMainWindow() -or !$application.WaitForExit(30000)) { throw 'The old application did not exit normally.' }
            $deadline = (Get-Date).AddMinutes(3)
            while ((Get-Date) -lt $deadline) {
              $newReady = Get-Content $readyFile -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json -ErrorAction SilentlyContinue
              if ($newReady -and $newReady.pid -ne $application.Id) {
                $restarted = Get-Process -Id $newReady.pid -ErrorAction SilentlyContinue
                if ($restarted) { break }
              }
              Start-Sleep -Milliseconds 500
            }
            if (!$restarted -or $newReady.version -ne $version -or $restarted.Path -ne $executable) {
              throw 'The Windows updater did not reopen the installed application with the same user data.'
            }
            if ((Get-Item -LiteralPath $executable).LastWriteTimeUtc -eq $oldWriteTime) {
              throw 'The Windows updater reopened the original executable without replacing it.'
            }
            Write-Host "AstraGit $version was replaced and reopened with PID $($restarted.Id)."
          } catch {
            $updateLog = Join-Path $env:ASTRAGIT_USER_DATA_DIR 'updates\windows-install.log'
            if (Test-Path $updateLog) {
              Get-Content -LiteralPath $updateLog | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host 'The Windows update helper did not write its startup log.'
            }
            throw
          } finally {
            foreach ($process in @($application, $restarted)) {
              if ($process -and !$process.HasExited) {
                if (!$process.CloseMainWindow() -or !$process.WaitForExit(10000)) {
                  $process | Stop-Process -Force
                }
              }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/AstraGit-*.${{ matrix.extension }}
            release/artifact-${{ matrix.artifact }}.json
          if-no-files-found: error
  publish:
    needs: [candidate, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 检出 Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: skylight-f/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: .tmp/homebrew-tap
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: 公开发行前复验 Homebrew 推送权限
        run: node scripts/sync-homebrew-tap.mjs --check-access .tmp/homebrew-tap
      - name: 校验全部资产后公开发行
        env:
          REQUIRE_APPLE_DISTRIBUTION: ${{ vars.REQUIRE_APPLE_DISTRIBUTION }}
        run: node scripts/publish-release.mjs
      - name: 同步 Homebrew Cask
        run: node scripts/sync-homebrew-tap.mjs .tmp/homebrew-tap
