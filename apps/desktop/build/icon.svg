      <stop stop-color="#1768ff"/>
      <stop offset=".46" stop-color="#7026ff"/>
      <stop offset="1" stop-color="#f719c8"/>
    </linearGradient>
    <linearGradient id="ag-upper" x1="540" y1="272" x2="942" y2="140" gradientUnits="userSpaceOnUse">
